[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-analysis"
version = "1.0.0"
description = "Software de análisis de video por drones autónomos para biomecánica deportiva"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Santiago Vasquez"}
]
dependencies = [
    "opencv-contrib-python>=4.8.0",
    "mediapipe>=0.10.14",
    "ultralytics>=8.0",
    "lapx>=0.5",
    "numpy<2",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
backend = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
drone = "cli:cli"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["detection*", "training*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
